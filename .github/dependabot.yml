version: 2

updates:
  - package-ecosystem: "gomod"
    directories:
      - "/apps/api"
      - "/packages/proto"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine minor and patch bumps (runtime modules and
      # pinned CI tools alike). Major bumps stay ungrouped for isolated review.
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      bun-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint rejects TS 7 ("typescript-eslint does not support TS
      # 7.0"), so major TypeScript bumps break lint. Drop this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 lands.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/dashboard"
      - "/deploy/docker/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
    rebase-strategy: "auto"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
