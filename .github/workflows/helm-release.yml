name: Helm Release

on:
  push:
    tags:
      - 'hasir-helm@*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  helm-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Configure git and Helm dependencies
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency update deploy/helm/charts/hasir

      - name: Package and publish Helm chart
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1
        with:
          charts_dir: deploy/helm/charts
          config: deploy/helm/cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
