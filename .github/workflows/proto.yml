name: Protobuf Checks

on:
  push:
    paths:
      - 'packages/proto/**'
  pull_request:
    paths:
      - 'packages/proto/**'

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: true
          breaking_against: "https://github.com/${GITHUB_REPOSITORY}.git#branch=main,subdir=packages/proto"
          token: ${{ secrets.BUF_TOKEN }}
