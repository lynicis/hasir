name: Proto Release

on:
  push:
    tags:
      - 'proto/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine versions
        id: versions
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          BSR_TAG="${CURRENT_TAG#proto/}"
          PREV_TAG=$(git tag -l 'proto/v*' --sort=-v:refname | head -2 | tail -1 || echo "")
          {
            echo "current=${CURRENT_TAG}"
            echo "bsr=${BSR_TAG}"
            echo "previous=${PREV_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Lint proto files
        uses: bufbuild/buf-action@v1
        with:
          lint: true
          input: packages/proto
          token: ${{ secrets.BUF_TOKEN }}

      - name: Check breaking changes (skip if first release)
        if: ${{ steps.versions.outputs.previous != '' }}
        uses: bufbuild/buf-action@v1
        with:
          breaking: true
          input: packages/proto
          breaking_against: "${{ github.server_url }}/${{ github.repository }}.git#tag=${{ steps.versions.outputs.previous }},subdir=packages/proto"
          token: ${{ secrets.BUF_TOKEN }}

      - name: Push to Buf Schema Registry
        run: buf push --label "${{ steps.versions.outputs.bsr }}"
        working-directory: packages/proto
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
